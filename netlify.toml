# Netlify: connect this repo and set base directory to repository root (this file lives at root).
# Required build env: VITE_API_URL = Render API origin, e.g. https://e-cunga-platform.onrender.com
# (no trailing slash)

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
