# Netlify: connect this repo and set base directory to repository root (this file lives at root).
# Required build env: VITE_API_URL = your API origin (no trailing slash). Options:
#   Render  → https://e-cunga-platform.onrender.com
#   Railway → https://<your-service>.up.railway.app   (see railway.toml at project root)
# Set whichever is currently active in Netlify → Site settings → Environment variables.

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sitemap and robots.txt should not be redirected
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = false

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = false

# Social preview image headers
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sitemap and robots.txt headers
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain"
