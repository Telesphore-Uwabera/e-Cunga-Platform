name: Deploy Render Backend

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "render.yaml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  trigger:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          # 1. Try deploy hook (preferred: no auth header required)
          if [ -n "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "Triggering deploy via Render deploy hook..."
            curl -sS -X POST "${RENDER_DEPLOY_HOOK}"
            echo
            echo "Successfully triggered deploy via RENDER_DEPLOY_HOOK."
            exit 0
          fi

          # 2. Try Render API Key if Service ID is provided
          if [ -n "${RENDER_API_KEY:-}" ] && [ -n "${RENDER_SERVICE_ID:-}" ]; then
            echo "Triggering deploy via Render API Key for service ${RENDER_SERVICE_ID}..."
            curl -sS -X POST \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}'
            echo
            echo "Successfully triggered deploy via Render API."
            exit 0
          fi

          echo "Notice: Neither RENDER_DEPLOY_HOOK nor (RENDER_API_KEY + RENDER_SERVICE_ID) secrets are configured."
          echo "Render auto-deploys automatically when connected to your GitHub repository."
