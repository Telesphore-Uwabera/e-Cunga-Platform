name: Trigger teletech-api deploy

# Fires on every push to main and tells teletech-api to redeploy on Render.
# Required secret in this repo:
#   GH_PAT  â†’  a GitHub Personal Access Token with repo scope
#              (Settings â†’ Secrets and variables â†’ Actions â†’ New secret)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch deploy event to Teletech-api
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT:-}" ]; then
            echo "::error::Missing secret GH_PAT. Add a GitHub PAT (repo scope) to this repo's secrets."
            exit 1
          fi
          curl -sS -X POST \
            "https://api.github.com/repos/Telesphore-Uwabera/Teletech-api/dispatches" \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"event_type":"deploy-teletech-api"}'
          echo "Dispatched deploy-teletech-api event to Teletech-api"

